<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Rent Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2pdf for generating PDF invoices -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-20">

    <div class="max-w-md mx-auto bg-gray-50 min-h-screen shadow-lg relative">
        
        <!-- Header -->
        <div class="bg-blue-600 text-white p-5 rounded-b-2xl shadow-md mb-6 sticky top-0 z-10 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold" id="appTitle">Rent Generator</h1>
                <p class="text-blue-100 text-sm mt-1" id="currentMonthYear"></p>
            </div>
            <button id="backBtn" onclick="goBack()" class="hidden bg-blue-700 hover:bg-blue-800 px-3 py-2 rounded-lg text-sm font-bold transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Edit Details
            </button>
        </div>

        <div class="px-4" id="mainContainer">
            
            <!-- DATA ENTRY VIEW -->
            <div id="view-entry">
                
                <!-- Property & Common Area Settings -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6">
                    <h2 class="text-lg font-bold text-gray-700 mb-3 border-b pb-2">Property & Common Settings</h2>
                    
                    <div class="mb-4">
                        <label class="block text-xs text-gray-700 mb-1 font-bold">Property Name</label>
                        <input type="text" id="propName" placeholder="e.g. Sunset Apartments" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="flex justify-between items-center mb-4">
                        <label class="text-sm font-bold text-gray-700">Unit Rate (₹)</label>
                        <input type="number" id="unitRate" placeholder="e.g. 8" class="w-24 p-2 border border-gray-300 rounded text-center font-bold focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Common Prev Reading</label>
                            <input type="number" id="commonPrev" placeholder="0" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-700 mb-1 font-bold">Common Curr Reading</label>
                            <input type="number" id="commonCurr" placeholder="0" class="w-full p-2 border border-blue-300 rounded bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-gray-700 mb-1 font-bold">Current Common Expenses (₹)</label>
                        <input type="number" id="commonExpense" placeholder="e.g. Guard, cleaning..." class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="flex justify-between items-center mb-3 px-1">
                    <h2 class="text-lg font-bold text-gray-700">Rooms & Tenants</h2>
                    <button onclick="addRoom()" class="bg-gray-200 text-gray-800 px-3 py-1 rounded-lg text-sm font-bold hover:bg-gray-300 transition">
                        <i class="fa-solid fa-plus"></i> Add Room
                    </button>
                </div>

                <!-- Dynamic Units Container -->
                <div id="unitsContainer"></div>

                <button onclick="calculateBills()" class="w-full bg-blue-600 text-white font-bold text-lg py-4 rounded-xl shadow-lg hover:bg-blue-700 active:transform active:scale-95 transition-all mt-4 mb-8">
                    Generate Invoices
                </button>
            </div>

            <!-- INVOICE VIEW -->
            <div id="view-invoices" class="hidden">
                <h2 class="text-lg font-bold text-gray-700 mb-3 px-1">Generated Invoices</h2>
                <div id="invoicesList"></div>
            </div>

        </div>
    </div>

    <script>
        let roomCounter = 0;
        let generatedInvoicesData = [];
        
        // Set dynamic date in header
        const dateOptions = { month: 'long', year: 'numeric' };
        const currentDateStr = new Date().toLocaleDateString('en-US', dateOptions);
        document.getElementById('currentMonthYear').innerText = currentDateStr;

        // Navigation Logic
        function showView(viewId) {
            document.getElementById('view-entry').classList.add('hidden');
            document.getElementById('view-invoices').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');

            const backBtn = document.getElementById('backBtn');
            if (viewId === 'view-entry') {
                backBtn.classList.add('hidden');
            } else {
                backBtn.classList.remove('hidden');
            }
        }

        function goBack() {
            showView('view-entry');
        }

        // Add Dynamic Room Field
        function addRoom() {
            roomCounter++;
            const id = roomCounter;
            
            const roomHTML = `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-4 relative" id="roomCard_${id}">
                    <button onclick="removeRoom(${id})" class="absolute top-3 right-3 text-red-500 hover:bg-red-50 p-1 rounded">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                    
                    <h3 class="font-bold text-gray-800 text-lg mb-3 border-b pb-2">Room Details</h3>
                    
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div>
                            <label class="block text-xs text-gray-600 mb-1">Room Name/No.</label>
                            <input type="text" id="name_${id}" placeholder="e.g. 101" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-600 mb-1">Tenant Name</label>
                            <input type="text" id="tenant_${id}" placeholder="e.g. Rahul" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="block text-xs text-gray-600 mb-1">WhatsApp Number (For sending bill)</label>
                        <input type="number" id="phone_${id}" placeholder="e.g. 9876543210" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-3 bg-gray-50 p-2 rounded-lg">
                        <div>
                            <label class="block text-xs text-gray-700 font-bold mb-1">Base Rent (₹)</label>
                            <input type="number" id="rent_${id}" placeholder="0" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs text-red-600 font-bold mb-1">Previous Dues (₹)</label>
                            <input type="number" id="dues_${id}" placeholder="0" class="w-full p-2 border border-red-200 bg-red-50 rounded focus:outline-none focus:ring-2 focus:ring-red-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Prev Room Reading</label>
                            <input type="number" id="prev_${id}" placeholder="0" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-700 mb-1 font-bold">Curr Room Reading</label>
                            <input type="number" id="curr_${id}" placeholder="0" class="w-full p-2 border border-blue-300 rounded bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-gray-700 mb-1">Current Extra Expenses (For this room only)</label>
                        <input type="number" id="extra_${id}" placeholder="e.g. Tap repair (₹)" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
            `;
            
            document.getElementById('unitsContainer').insertAdjacentHTML('beforeend', roomHTML);
        }

        function removeRoom(id) {
            document.getElementById(`roomCard_${id}`).remove();
        }

        function getVal(id) {
            return parseFloat(document.getElementById(id)?.value) || 0;
        }
        
        function getStr(id) {
            return document.getElementById(id)?.value || '';
        }

        // Calculate and Generate Invoices
        function calculateBills() {
            const propName = getStr('propName') || 'Unnamed Property';
            const unitRate = getVal('unitRate');
            const commonPrev = getVal('commonPrev');
            const commonCurr = getVal('commonCurr');
            const commonExpense = getVal('commonExpense');

            // Count Active Units
            const unitCards = document.querySelectorAll('[id^="roomCard_"]');
            const totalUnits = unitCards.length;

            if (totalUnits === 0) {
                alert("Please add at least one room before calculating.");
                return;
            }
            if (unitRate === 0) {
                alert("Please enter a valid Unit Rate.");
                return;
            }
            
            // Common Math
            let commonElecCost = 0;
            if (commonCurr > commonPrev) {
                commonElecCost = (commonCurr - commonPrev) * unitRate;
            }
            const commonElecPerUnit = commonElecCost / totalUnits;
            const commonExpPerUnit = commonExpense / totalUnits;

            const resultsContainer = document.getElementById('invoicesList');
            resultsContainer.innerHTML = '';
            generatedInvoicesData = []; 

            // Loop through each dynamically added room
            unitCards.forEach(card => {
                const id = card.id.split('_')[1]; // extract ID number
                
                const roomName = getStr(`name_${id}`) || `Room ${id}`;
                const tenantName = getStr(`tenant_${id}`) || `Tenant`;
                const phone = getStr(`phone_${id}`);
                const rent = getVal(`rent_${id}`);
                const dues = getVal(`dues_${id}`);
                const prev = getVal(`prev_${id}`);
                const curr = getVal(`curr_${id}`);
                const extra = getVal(`extra_${id}`);

                let unitElecCost = 0;
                let unitUnitsConsumed = 0;
                if (curr > prev) {
                    unitUnitsConsumed = curr - prev;
                    unitElecCost = unitUnitsConsumed * unitRate;
                }

                const totalBill = rent + unitElecCost + commonElecPerUnit + commonExpPerUnit + extra + dues;

                const invoiceData = {
                    id: id,
                    propName: propName,
                    roomName: roomName,
                    tenantName: tenantName,
                    phone: phone,
                    rent: rent,
                    dues: dues,
                    unitUnitsConsumed: unitUnitsConsumed,
                    unitElecCost: unitElecCost,
                    commonElecPerUnit: commonElecPerUnit,
                    commonExpPerUnit: commonExpPerUnit,
                    extraCharge: extra,
                    totalBill: Math.round(totalBill)
                };
                generatedInvoicesData.push(invoiceData);

                // Build Invoice HTML
                const invoiceHTML = `
                    <div class="mb-6 relative">
                        <div id="invoice-card-${id}" class="bg-white border border-gray-200 p-6 rounded-xl shadow-sm relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-full h-2 bg-blue-600"></div>
                            
                            <div class="flex justify-between items-start mt-2 mb-4">
                                <div>
                                    <h3 class="text-2xl font-bold text-gray-800">${roomName}</h3>
                                    <p class="text-sm text-gray-500 font-medium">${propName}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-xs text-gray-400 font-bold uppercase tracking-wider">Invoice Date</p>
                                    <p class="text-sm font-semibold text-gray-700">${currentDateStr}</p>
                                </div>
                            </div>

                            <div class="bg-gray-50 p-3 rounded-lg mb-5">
                                <p class="text-xs text-gray-500 mb-1">Billed To:</p>
                                <p class="font-bold text-gray-800">${tenantName}</p>
                            </div>
                            
                            <div class="text-sm text-gray-600 space-y-3 mb-5 border-b border-dashed border-gray-300 pb-5">
                                <div class="flex justify-between"><span>Base Rent:</span> <span class="font-semibold text-gray-800">₹${rent.toFixed(2)}</span></div>
                                <div class="flex justify-between">
                                    <span>Room Electricity <span class="text-xs text-gray-400">(${unitUnitsConsumed} units @ ₹${unitRate})</span>:</span> 
                                    <span class="font-semibold text-gray-800">₹${unitElecCost.toFixed(2)}</span>
                                </div>
                                <div class="flex justify-between"><span>Common Electricity:</span> <span class="font-semibold text-gray-800">₹${commonElecPerUnit.toFixed(2)}</span></div>
                                <div class="flex justify-between"><span>Common Maintenance:</span> <span class="font-semibold text-gray-800">₹${commonExpPerUnit.toFixed(2)}</span></div>
                                
                                ${extra > 0 ? `<div class="flex justify-between text-red-500 font-medium"><span>Extra Expenses:</span> <span>₹${extra.toFixed(2)}</span></div>` : ''}
                                ${dues > 0 ? `<div class="flex justify-between text-red-500 font-medium"><span>Previous Dues:</span> <span>₹${dues.toFixed(2)}</span></div>` : ''}
                            </div>
                            
                            <div class="flex justify-between items-end mb-2">
                                <span class="text-gray-600 font-bold uppercase tracking-wide text-sm">Total Due</span>
                                <span class="text-3xl font-black text-blue-700">₹${invoiceData.totalBill}</span>
                            </div>
                        </div>

                        <button id="btn-${id}" onclick="shareInvoicePDF('${id}')" class="w-full bg-[#25D366] text-white font-bold py-3 rounded-xl shadow-md hover:bg-[#1ebd5a] active:scale-95 transition-all flex items-center justify-center gap-2 mt-2">
                            <i class="fa-brands fa-whatsapp text-xl"></i> Share PDF & Message
                        </button>
                    </div>
                `;
                resultsContainer.innerHTML += invoiceHTML;
            });

            showView('view-invoices');
        }

        // Generate PDF and Native Share / WhatsApp Fallback
        async function shareInvoicePDF(unitId) {
            const data = generatedInvoicesData.find(u => u.id === unitId);
            if (!data) return;

            const btn = document.getElementById(`btn-${unitId}`);
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Generating PDF...`;
            btn.disabled = true;

            const invoiceElement = document.getElementById(`invoice-card-${unitId}`);
            
            const text = 
`Hello ${data.tenantName},
Here is your rent & utility breakdown for ${currentDateStr}.

Total Due: ₹${data.totalBill}

Please process the payment via UPI to 9729999000 at your earliest convenience. See the attached PDF for the full breakdown. Thank you!`;

            try {
                const opt = {
                    margin: 0.2,
                    filename: `${data.roomName}_Invoice.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'in', format: 'a5', orientation: 'portrait' }
                };

                const pdfBlob = await html2pdf().set(opt).from(invoiceElement).outputPdf('blob');
                const file = new File([pdfBlob], opt.filename, { type: 'application/pdf' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: 'Rent Invoice',
                        text: text,
                        files: [file]
                    });
                } else {
                    html2pdf().set(opt).from(invoiceElement).save();
                    const whatsappPhone = data.phone ? `91${data.phone.replace(/\D/g, '')}` : ''; // Clean formatting, default to India +91
                    const whatsappUrl = `https://wa.me/${whatsappPhone}?text=${encodeURIComponent(text)}`;
                    window.open(whatsappUrl, '_blank');
                    alert("PDF downloaded. Opening WhatsApp Web so you can attach it manually.");
                }
            } catch (error) {
                console.error("Error sharing PDF:", error);
                alert("An error occurred while generating the invoice.");
            } finally {
                btn.innerHTML = `<i class="fa-brands fa-whatsapp text-xl"></i> Share PDF & Message`;
                btn.disabled = false;
            }
        }

        // Initialize App by adding one empty room automatically
        window.onload = () => {
            addRoom();
        };

    </script>
</body>
</html>
