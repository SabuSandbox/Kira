<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Rent & Property Manager</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rent Manager">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">

    <link rel="apple-touch-icon" sizes="180x180" href="image.png">
    <link rel="icon" type="image/png" sizes="192x192" href="image.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        /* iOS style scrollbar hiding */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-black text-white pb-16 min-h-screen relative overflow-x-hidden selection:bg-[#0a84ff]/30">

    <div class="max-w-md mx-auto min-h-screen relative flex flex-col z-10">
        
        <header id="mainHeader" class="hidden backdrop-blur-2xl bg-black/80 border-b border-[#38383a] px-4 pt-10 pb-3 sticky top-0 z-30">
            <div class="flex justify-between items-center mb-1">
                <button id="backBtn" onclick="handleBackNavigation()" class="hidden text-[#0a84ff] text-[17px] font-normal tracking-tight active:opacity-60 transition flex items-center gap-1">
                    <i class="fa-solid fa-chevron-left"></i> Back
                </button>
                <div class="flex-1"></div>
                <button id="adminBtn" onclick="navigateTo('admin')" class="bg-[#1c1c1e] text-[#0a84ff] px-3 py-1.5 rounded-full text-[13px] font-medium transition flex items-center gap-1.5 active:scale-95">
                    <i class="fa-solid fa-sliders"></i> Admin
                </button>
            </div>
            
            <div class="flex justify-between items-end mt-2">
                <div class="cursor-pointer flex items-center gap-3" onclick="navigateTo('home')">
                    <img src="image.png" alt="App Logo" class="w-10 h-10 rounded-xl object-contain shadow-sm bg-white">
                    <div>
                        <h1 class="text-[28px] font-bold tracking-tight text-white leading-tight flex items-center gap-1.5">
                            Rent Manager
                            <span id="syncIndicator" class="inline-block w-2 h-2 rounded-full bg-[#32d74b] shadow-[0_0_8px_#32d74b]" title="Synchronized"></span>
                        </h1>
                        <p class="text-[#8e8e93] text-[13px] font-medium -mt-0.5" id="headerSubText">Locations</p>
                    </div>
                </div>
            </div>
        </header>

        <main class="p-4 flex-1">
            
            <section id="view-auth" class="flex flex-col justify-center min-h-[85vh]">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 mx-auto mb-4 bg-white rounded-2xl shadow-xl overflow-hidden p-2">
                        <img src="image.png" alt="App Logo" class="w-full h-full object-contain">
                    </div>
                    <h2 class="text-[28px] font-bold text-white tracking-tight">Sync & Backup</h2>
                    <p class="text-[15px] text-[#8e8e93] mt-2 px-6">Sign in to securely synchronize your property data across all your devices.</p>
                </div>

                <div class="space-y-4 bg-[#1c1c1e] p-5 rounded-[24px]">
                    <div>
                        <input type="email" id="authEmail" placeholder="Email" class="w-full p-4 rounded-xl bg-[#2c2c2e] text-white text-[17px] placeholder-[#8e8e93] focus:ring-2 focus:ring-[#0a84ff] outline-none transition">
                    </div>
                    <div>
                        <input type="password" id="authPassword" placeholder="Password" class="w-full p-4 rounded-xl bg-[#2c2c2e] text-white text-[17px] placeholder-[#8e8e93] focus:ring-2 focus:ring-[#0a84ff] outline-none transition">
                    </div>

                    <div id="authErrorMsg" class="hidden text-[13px] text-[#ff453a] bg-[#ff453a]/10 p-3 rounded-xl text-center font-medium"></div>

                    <div class="flex flex-col gap-3 pt-2">
                        <button onclick="handleLogin()" id="loginBtn" class="w-full bg-[#0a84ff] text-white font-semibold py-4 rounded-xl transition-all active:scale-[0.98] text-[17px]">
                            Log In
                        </button>
                        <button onclick="handleSignup()" class="w-full bg-[#2c2c2e] text-white font-semibold py-4 rounded-xl transition active:scale-[0.98] text-[17px]">
                            Create Account
                        </button>
                    </div>
                    
                    <button onclick="continueOffline()" class="w-full text-center text-[15px] text-[#0a84ff] font-medium pt-3 active:opacity-60 transition">
                        Continue Offline Mode
                    </button>
                </div>
            </section>

            <section id="view-home" class="hidden">
                <div class="flex justify-between items-center mb-3 px-1">
                    <h2 class="text-[13px] font-semibold uppercase text-[#8e8e93] tracking-wide">My Properties</h2>
                    <span id="propCountBadge" class="text-[13px] text-[#8e8e93] font-medium">0</span>
                </div>
                <div id="homePropertiesContainer" class="space-y-3"></div>
            </section>

            <section id="view-property-months" class="hidden">
                <div class="bg-[#1c1c1e] p-5 rounded-[24px] mb-6 shadow-sm">
                    <h2 class="text-[22px] font-bold text-white tracking-tight" id="propDetailsName">Property Name</h2>
                    <div class="flex flex-wrap items-center gap-3 text-[14px] text-[#8e8e93] mt-2 font-medium">
                        <span class="bg-[#2c2c2e] px-2.5 py-1 rounded-lg text-white">₹<span id="propDetailsRate">0</span>/unit</span>
                        <span class="bg-[#2c2c2e] px-2.5 py-1 rounded-lg text-white"><span id="propDetailsRooms">0</span> Units</span>
                    </div>
                </div>

                <div class="px-1 mb-2">
                    <h3 class="text-[13px] font-semibold uppercase text-[#8e8e93] tracking-wide">Billing Cycles</h3>
                </div>
                <div id="monthsListContainer" class="bg-[#1c1c1e] rounded-[24px] overflow-hidden divide-y divide-[#38383a]"></div>
            </section>

            <section id="view-month-billing" class="hidden">
                <div class="flex justify-between items-center mb-4 px-1">
                    <div>
                        <h2 class="text-[22px] font-bold text-white tracking-tight" id="billingMonthTitle">Month Year</h2>
                        <p class="text-[15px] text-[#8e8e93]" id="billingLocationSubtitle">Location</p>
                    </div>
                    <span id="billingStatusBadge" class="text-[13px] px-3 py-1.5 rounded-full font-semibold">Status</span>
                </div>

                <div class="bg-[#1c1c1e] p-5 rounded-[24px] mb-5">
                    <h3 class="text-[15px] font-semibold text-white mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-bolt text-[#ffcc00]"></i> Common Area Setup
                    </h3>
                    
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div>
                            <label class="block text-[13px] text-[#8e8e93] mb-1.5 font-medium">Previous Reading</label>
                            <input type="number" id="inputCommonPrev" class="w-full p-3 rounded-xl bg-[#2c2c2e] text-white text-[15px] outline-none focus:ring-2 focus:ring-[#0a84ff]">
                        </div>
                        <div>
                            <label class="block text-[13px] text-[#0a84ff] mb-1.5 font-medium">Current Reading</label>
                            <input type="number" id="inputCommonCurr" placeholder="0" class="w-full p-3 rounded-xl bg-[#2c2c2e] border border-[#0a84ff]/30 text-white text-[15px] outline-none focus:ring-2 focus:ring-[#0a84ff]">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[13px] text-[#8e8e93] mb-1.5 font-medium">Shared Expenses (₹)</label>
                        <input type="number" id="inputCommonExpense" placeholder="0" class="w-full p-3 rounded-xl bg-[#2c2c2e] text-white text-[15px] outline-none focus:ring-2 focus:ring-[#0a84ff]">
                    </div>
                </div>

                <div class="px-1 mb-2 flex justify-between items-center">
                    <h3 class="text-[13px] font-semibold uppercase text-[#8e8e93] tracking-wide">Tenant Units</h3>
                </div>
                
                <div id="billingRoomsContainer" class="space-y-4 mb-8"></div>

                <div class="space-y-3 mb-8 bg-[#1c1c1e] p-5 rounded-[24px]">
                    <button onclick="saveMonthlyCalculations()" id="saveBtn" class="w-full bg-[#0a84ff] text-white font-semibold py-4 rounded-xl transition-all active:scale-[0.98] text-[17px]">
                        <span id="saveBtnText">Save Calculations</span>
                    </button>
                    <button id="exportPdfBtn" onclick="exportMonthlyStatementPDF()" class="hidden w-full bg-[#32d74b] text-black font-semibold py-4 rounded-xl transition-all active:scale-[0.98] flex items-center justify-center gap-2 text-[17px]">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Export PDF Statement
                    </button>
                    <button id="deleteMonthRecordBtn" onclick="deleteCurrentMonthRecord()" class="hidden w-full bg-[#ff453a]/10 text-[#ff453a] font-semibold py-4 rounded-xl transition-all active:scale-[0.98] text-[17px]">
                        Delete Record
                    </button>
                </div>
            </section>

            <section id="view-admin" class="hidden">
                <div class="flex justify-between items-center mb-4 px-1">
                    <h2 class="text-[22px] font-bold tracking-tight text-white">Admin Hub</h2>
                    <button onclick="openCreatePropertyPrompt()" class="bg-[#0a84ff] text-white px-4 py-2 rounded-full text-[15px] font-semibold active:scale-95 transition">
                        <i class="fa-solid fa-plus mr-1"></i> Add
                    </button>
                </div>

                <div id="adminPropertyList" class="space-y-5 mb-8"></div>

                <div class="bg-[#1c1c1e] rounded-[24px] p-5 flex justify-between items-center">
                    <div>
                        <p class="text-[13px] text-[#8e8e93] font-medium">Logged in as</p>
                        <p id="userDisplayEmail" class="text-[15px] text-white font-semibold">Local Cache</p>
                    </div>
                    <button onclick="handleSignOut()" class="bg-[#2c2c2e] text-[#ff453a] px-4 py-2 rounded-xl text-[15px] font-semibold active:scale-95 transition">
                        Sign Out
                    </button>
                </div>
            </section>

        </main>
    </div>

    <!-- Hidden PDF Template Container -->
    <div style="position: fixed; top: 0; left: 0; width: 750px; height: 0; overflow: hidden; z-index: -50; pointer-events: none;">
        <div id="pdfPrintableTemplate" style="width: 750px; background-color: #ffffff; color: #000000; padding: 32px; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAFHn1LLEYgG2-gPlImQQ6AsXY183r5AgI",
            authDomain: "kira-15433.firebaseapp.com",
            projectId: "kira-15433",
            storageBucket: "kira-15433.firebasestorage.app",
            messagingSenderId: "39799805654",
            appId: "1:39799805654:web:36a80f7bfa3138bc879b77",
            measurementId: "G-C265XTC6RG"
        };

        const LOCAL_STORAGE_KEY = 'universal_rent_manager_store';
        const LOCAL_AUTH_KEY = 'universal_rent_auth_flag';
        
        let auth = null;
        let firestore = null;
        let currentUser = null;
        let isCloudMode = false;
        let cloudSyncTimeout = null;

        let db = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY)) || {
            properties: [
                {
                    id: 'prop_demo',
                    name: 'Sunshine Residency',
                    unitRate: 8.5,
                    commonBaseReading: 1200,
                    rooms: [
                        { id: 'room_101', name: '101', tenant: 'Rahul Sharma', rent: 8000, defaultDues: 0, lastReading: 450, isExempt: false },
                        { id: 'room_102', name: '102', tenant: 'Priya Verma', rent: 9000, defaultDues: 0, lastReading: 780, isExempt: false }
                    ],
                    history: {}
                }
            ]
        };

        function saveStore(syncCloudImmediate = false) {
            try {
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(db));
            } catch (e) {
                console.error("Local storage quota error:", e);
            }

            const syncDot = document.getElementById('syncIndicator');
            if (syncDot) syncDot.classList.add('animate-pulse');

            if (isCloudMode && currentUser) {
                if (syncCloudImmediate) {
                    executeCloudSave();
                } else {
                    clearTimeout(cloudSyncTimeout);
                    cloudSyncTimeout = setTimeout(executeCloudSave, 400);
                }
            } else {
                if (syncDot) syncDot.classList.remove('animate-pulse');
            }
        }

        async function executeCloudSave() {
            const syncDot = document.getElementById('syncIndicator');
            try {
                await firestore.collection('user_stores').doc(currentUser.uid).set(db, { merge: true });
            } catch (err) {
                console.warn("Background sync error:", err);
            } finally {
                if (syncDot) syncDot.classList.remove('animate-pulse');
            }
        }

        if (firebaseConfig.apiKey && firebaseConfig.projectId) {
            try {
                firebase.initializeApp(firebaseConfig);
                auth = firebase.auth();
                firestore = firebase.firestore();
                isCloudMode = true;

                auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        currentUser = user;
                        document.getElementById('view-auth').classList.add('hidden');
                        document.getElementById('mainHeader').classList.remove('hidden');
                        document.getElementById('userDisplayEmail').innerText = user.email;
                        
                        try {
                            const doc = await firestore.collection('user_stores').doc(user.uid).get();
                            if (doc.exists) {
                                db = doc.data();
                                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(db));
                            } else {
                                saveStore(true);
                            }
                        } catch(e) {
                            console.warn("Using local cache due to network check");
                        }
                        navigateTo('home');
                    } else {
                        currentUser = null;
                        document.getElementById('mainHeader').classList.add('hidden');
                        ['view-home', 'view-property-months', 'view-month-billing', 'view-admin'].forEach(v => {
                            document.getElementById(v).classList.add('hidden');
                        });
                        document.getElementById('view-auth').classList.remove('hidden');
                    }
                });
            } catch(e) {
                initLocalAuth();
            }
        } else {
            initLocalAuth();
        }

        function initLocalAuth() {
            isCloudMode = false;
            const isAuthed = localStorage.getItem(LOCAL_AUTH_KEY);
            if (isAuthed === 'true') {
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('mainHeader').classList.remove('hidden');
                document.getElementById('userDisplayEmail').innerText = "Offline Mode";
                navigateTo('home');
            } else {
                document.getElementById('mainHeader').classList.add('hidden');
                document.getElementById('view-auth').classList.remove('hidden');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('authEmail').value.trim();
            const pass = document.getElementById('authPassword').value;
            const errBox = document.getElementById('authErrorMsg');
            errBox.classList.add('hidden');

            if (isCloudMode) {
                try {
                    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
                    await auth.signInWithEmailAndPassword(email, pass);
                } catch (e) {
                    errBox.innerText = e.message;
                    errBox.classList.remove('hidden');
                }
            } else {
                if (!pass) {
                    errBox.innerText = "Please enter a password.";
                    errBox.classList.remove('hidden');
                    return;
                }
                localStorage.setItem(LOCAL_AUTH_KEY, 'true');
                initLocalAuth();
            }
        }

        async function handleSignup() {
            const email = document.getElementById('authEmail').value.trim();
            const pass = document.getElementById('authPassword').value;
            const errBox = document.getElementById('authErrorMsg');
            errBox.classList.add('hidden');

            if (isCloudMode) {
                try {
                    await auth.createUserWithEmailAndPassword(email, pass);
                } catch (e) {
                    errBox.innerText = e.message;
                    errBox.classList.remove('hidden');
                }
            } else {
                handleLogin();
            }
        }

        function continueOffline() {
            localStorage.setItem(LOCAL_AUTH_KEY, 'true');
            initLocalAuth();
        }

        function handleSignOut() {
            if (confirm("Log out?")) {
                if (isCloudMode) {
                    auth.signOut();
                } else {
                    localStorage.removeItem(LOCAL_AUTH_KEY);
                    initLocalAuth();
                }
            }
        }

        let currentView = 'home';
        let selectedPropId = null;
        let selectedMonthKey = null;

        function getMonthKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            return `${y}-${m}`;
        }

        function formatMonthKey(monthKey) {
            const [y, m] = monthKey.split('-').map(Number);
            return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
        }

        function generateRecentMonthsList() {
            const list = [];
            const d = new Date();
            for (let i = 0; i < 6; i++) {
                const target = new Date(d.getFullYear(), d.getMonth() - i, 1);
                list.push(getMonthKey(target));
            }
            return list;
        }

        function navigateTo(view, payload = {}) {
            currentView = view;
            ['view-home', 'view-property-months', 'view-month-billing', 'view-admin'].forEach(v => {
                document.getElementById(v).classList.add('hidden');
            });

            const backBtn = document.getElementById('backBtn');
            const adminBtn = document.getElementById('adminBtn');
            const headerSubText = document.getElementById('headerSubText');

            if (view === 'home') {
                document.getElementById('view-home').classList.remove('hidden');
                backBtn.classList.add('hidden');
                adminBtn.classList.remove('hidden');
                headerSubText.innerText = 'Locations';
                selectedPropId = null;
                selectedMonthKey = null;
                renderHomeProperties();
            } else if (view === 'property-months') {
                document.getElementById('view-property-months').classList.remove('hidden');
                backBtn.classList.remove('hidden');
                adminBtn.classList.add('hidden');
                selectedPropId = payload.propId;
                const prop = db.properties.find(p => p.id === selectedPropId);
                headerSubText.innerText = prop ? prop.name : 'History';
                renderPropertyMonths();
            } else if (view === 'month-billing') {
                document.getElementById('view-month-billing').classList.remove('hidden');
                backBtn.classList.remove('hidden');
                adminBtn.classList.add('hidden');
                selectedMonthKey = payload.monthKey;
                headerSubText.innerText = formatMonthKey(selectedMonthKey);
                renderMonthBillingView();
            } else if (view === 'admin') {
                document.getElementById('view-admin').classList.remove('hidden');
                backBtn.classList.remove('hidden');
                adminBtn.classList.add('hidden');
                headerSubText.innerText = 'Settings';
                renderAdminProperties();
            }
            window.scrollTo(0, 0);
        }

        function handleBackNavigation() {
            if (currentView === 'month-billing') {
                navigateTo('property-months', { propId: selectedPropId });
            } else if (currentView === 'property-months' || currentView === 'admin') {
                navigateTo('home');
            }
        }

        function renderHomeProperties() {
            const container = document.getElementById('homePropertiesContainer');
            document.getElementById('propCountBadge').innerText = `${db.properties.length} Active`;

            if (db.properties.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-[#1c1c1e] rounded-[24px]">
                        <p class="text-[15px] text-[#8e8e93]">No properties found.</p>
                        <button onclick="navigateTo('admin')" class="mt-4 text-[#0a84ff] font-semibold text-[15px]">Add Property</button>
                    </div>`;
                return;
            }

            container.innerHTML = db.properties.map(p => {
                const sortedKeys = Object.keys(p.history || {}).sort();
                let subtitleHtml = `<span class="text-[#8e8e93]">No past collections</span>`;
                
                if (sortedKeys.length > 0) {
                    const lastKey = sortedKeys[sortedKeys.length - 1];
                    const lastRecord = p.history[lastKey];
                    subtitleHtml = `Last Total: <span class="text-white font-medium">₹${lastRecord.summary.grandTotal}</span> <span class="text-[#8e8e93] text-[13px] ml-1">(${formatMonthKey(lastKey)})</span>`;
                }

                return `
                <div onclick="navigateTo('property-months', { propId: '${p.id}' })" 
                     class="bg-[#1c1c1e] hover:bg-[#2c2c2e] p-5 rounded-[24px] mb-3 transition cursor-pointer flex justify-between items-center active:scale-[0.98]">
                    <div>
                        <h3 class="font-bold text-[19px] text-white tracking-tight mb-1">${p.name}</h3>
                        <p class="text-[15px] text-[#8e8e93]">
                            ${subtitleHtml}
                        </p>
                    </div>
                    <div class="text-[#38383a]">
                        <i class="fa-solid fa-chevron-right text-lg"></i>
                    </div>
                </div>
                `;
            }).join('');
        }

        function renderPropertyMonths() {
            const prop = db.properties.find(p => p.id === selectedPropId);
            if (!prop) return;

            document.getElementById('propDetailsName').innerText = prop.name;
            document.getElementById('propDetailsRate').innerText = prop.unitRate;
            document.getElementById('propDetailsRooms').innerText = prop.rooms.length;

            const months = generateRecentMonthsList();
            const container = document.getElementById('monthsListContainer');

            container.innerHTML = months.map((mKey, idx) => {
                const isCurrentMonth = idx === 0;
                const record = prop.history && prop.history[mKey];
                const isCreated = !!record;

                let rightSideHtml = '';

                if (isCreated) {
                    rightSideHtml = `
                        <div class="text-right">
                            <p class="text-[17px] font-semibold text-white">₹${record.summary.grandTotal}</p>
                            <p class="text-[13px] text-[#32d74b] font-medium">Saved</p>
                        </div>
                    `;
                } else {
                    rightSideHtml = `
                        <div class="text-right">
                            <p class="text-[15px] text-[#8e8e93]">Pending</p>
                        </div>
                    `;
                }

                return `
                    <div onclick="navigateTo('month-billing', { monthKey: '${mKey}' })" 
                         class="p-5 flex justify-between items-center bg-[#1c1c1e] hover:bg-[#2c2c2e] transition cursor-pointer active:bg-[#38383a]">
                        <div class="flex items-center gap-3">
                            <h4 class="font-semibold text-[17px] text-white">${formatMonthKey(mKey)}</h4>
                            ${isCurrentMonth ? '<span class="bg-[#0a84ff] text-white text-[11px] font-bold px-2 py-0.5 rounded-md uppercase tracking-wide">Current</span>' : ''}
                        </div>
                        <div class="flex items-center gap-3">
                            ${rightSideHtml}
                            <i class="fa-solid fa-chevron-right text-[#38383a]"></i>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMonthBillingView() {
            const prop = db.properties.find(p => p.id === selectedPropId);
            if (!prop) return;

            document.getElementById('billingMonthTitle').innerText = formatMonthKey(selectedMonthKey);
            document.getElementById('billingLocationSubtitle').innerText = `${prop.name} — ₹${prop.unitRate}/unit`;

            const record = prop.history ? prop.history[selectedMonthKey] : null;
            
            let lastRecord = null;
            if (prop.history) {
                const pastKeys = Object.keys(prop.history)
                    .filter(k => k < selectedMonthKey)
                    .sort();
                if (pastKeys.length > 0) {

        function saveMonthlyCalculations() {
            const prop = db.properties.find(p => p.id === selectedPropId);
            if (!prop || prop.rooms.length === 0) return;

            const saveBtnText = document.getElementById('saveBtnText');
            if (saveBtnText) saveBtnText.innerText = `Saving...`;

            const unitRate = prop.unitRate;
            const commonPrev = parseFloat(document.getElementById('inputCommonPrev').value) || 0;
            const commonCurr = parseFloat(document.getElementById('inputCommonCurr').value) || 0;
            const commonExpense = parseFloat(document.getElementById('inputCommonExpense').value) || 0;
            const totalUnits = prop.rooms.length;

            const commonUnits = (commonCurr > commonPrev) ? (commonCurr - commonPrev) : 0;
            const commonElecCost = commonUnits * unitRate;
            
            // Determine how many tenants are NOT exempt
            let participatingUnits = 0;
            prop.rooms.forEach(room => {
                const isExempt = document.getElementById(`exempt_${room.id}`).checked;
                if (!isExempt) participatingUnits++;
            });

            // Prevent division by zero
            const effectiveUnits = participatingUnits > 0 ? participatingUnits : 1;
            const commonElecPerUnit = commonElecCost / effectiveUnits;
            const commonExpPerUnit = commonExpense / effectiveUnits;

            let grandTotal = 0;
            const computedRoomsData = [];

            prop.rooms.forEach(room => {
                const prev = parseFloat(document.getElementById(`prev_${room.id}`).value) || 0;
                const curr = parseFloat(document.getElementById(`curr_${room.id}`).value) || 0;
                const dues = parseFloat(document.getElementById(`dues_${room.id}`).value) || 0;
                const extra = parseFloat(document.getElementById(`extra_${room.id}`).value) || 0;
                const advance = parseFloat(document.getElementById(`advance_${room.id}`).value) || 0;
                const isExempt = document.getElementById(`exempt_${room.id}`).checked;

                const consumedUnits = (curr > prev) ? (curr - prev) : 0;
                const elecBill = consumedUnits * unitRate;
                
                // Exempt tenants pay 0 towards common areas
                const roomCommonElec = isExempt ? 0 : commonElecPerUnit;
                const roomCommonExp = isExempt ? 0 : commonExpPerUnit;

                // Advance amount is subtracted from total bill
                const totalBill = Math.round(room.rent + elecBill + roomCommonElec + roomCommonExp + extra + dues - advance);

                grandTotal += totalBill;

                computedRoomsData.push({
                    roomId: room.id,
                    name: room.name,
                    tenant: room.tenant,
                    rent: room.rent,
                    prevReading: prev,
                    currReading: curr,
                    consumedUnits: consumedUnits,
                    elecBill: elecBill,
                    commonElecShare: roomCommonElec,
                    commonExpShare: roomCommonExp,
                    dues: dues,
                    extra: extra,
                    advance: advance,
                    isExempt: isExempt,
                    totalBill: totalBill
                });
            });

            if (!prop.history) prop.history = {};
            prop.history[selectedMonthKey] = {
                monthKey: selectedMonthKey,
                savedAt: new Date().toISOString(),
                commonPrev: commonPrev,
                commonCurr: commonCurr,
                commonUnits: commonUnits,
                commonElecCost: commonElecCost,
                commonExpense: commonExpense,
                roomsData: computedRoomsData,
                summary: {
                    grandTotal: grandTotal,
                    totalRooms: totalUnits,
                    participatingRooms: participatingUnits,
                    perUnitCommonElec: commonElecPerUnit,
                    perUnitCommonExp: commonExpPerUnit
                }
            };

            saveStore(true);
            renderMonthBillingView();
        }

        function deleteCurrentMonthRecord() {
            if (!confirm(`Delete calculations for ${formatMonthKey(selectedMonthKey)}?`)) return;
            const prop = db.properties.find(p => p.id === selectedPropId);
            if (prop && prop.history && prop.history[selectedMonthKey]) {
                delete prop.history[selectedMonthKey];
                saveStore(true);
                renderMonthBillingView();
            }
        }

        function updatePropField(propId, field, value) {
            const prop = db.properties.find(p => p.id === propId);
            if (!prop) return;
            if (field === 'unitRate' || field === 'commonBaseReading') {
                prop[field] = parseFloat(value) || 0;
            } else {
                prop[field] = value.trim();
            }
            saveStore();
        }

        function updateRoomField(propId, roomId, field, value) {
            const prop = db.properties.find(p => p.id === propId);
            if (!prop) return;
            const room = prop.rooms.find(r => r.id === roomId);
            if (!room) return;

            if (field === 'rent' || field === 'lastReading') {
                room[field] = parseFloat(value) || 0;
            } else if (field === 'isExempt') {
                room[field] = value;
            } else {
                room[field] = value.trim();
            }
            saveStore();
        }

            `).join('');
        }

        function saveLocationComplete(propId) {
            saveStore(true);
            alert("Settings saved successfully");
        }

        function openCreatePropertyPrompt() {
            const name = prompt("Location / Property Name:");
            if (!name) return;
            const rate = parseFloat(prompt("Electricity Unit Rate (₹):", "8")) || 0;
            const commonMeter = parseFloat(prompt("Baseline Common Meter Reading:", "0")) || 0;

            db.properties.push({
                id: 'prop_' + Date.now(),
                name: name.trim(),
                unitRate: rate,
                commonBaseReading: commonMeter,
                rooms: [],
                history: {}
            });
            saveStore(true);
            renderAdminProperties();
        }

        function deleteProperty(propId) {
            if (!confirm("Are you sure you want to delete this property and all history?")) return;
            db.properties = db.properties.filter(p => p.id !== propId);
            saveStore(true);
            renderAdminProperties();
        }

        function openAddRoomPrompt(propId) {
            const prop = db.properties.find(p => p.id === propId);
            if (!prop) return;

            const name = prompt("Room Name/No:");
            if (!name) return;
            const tenant = prompt("Tenant Name:", "New Tenant") || "Tenant";
            const rent = parseFloat(prompt("Base Rent (₹):", "7000")) || 0;
            const lastReading = parseFloat(prompt("Base Meter Reading:", "0")) || 0;

            prop.rooms.push({
                id: 'room_' + Date.now(),
                name: name.trim(),
                tenant: tenant.trim(),
                rent: rent,
                defaultDues: 0,
                lastReading: lastReading,
                isExempt: false
            });

            saveStore(true);
            renderAdminProperties();
        }

        function deleteRoom(propId, roomId) {
            const prop = db.properties.find(p => p.id === propId);
            if (!prop) return;
            if (!confirm("Remove this unit?")) return;

            prop.rooms = prop.rooms.filter(r => r.id !== roomId);
            saveStore(true);
            renderAdminProperties();
        }
    </script>
</body>
</html>
