    <script>
        (function() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 512, 512);
            grad.addColorStop(0, '#1e293b');
            grad.addColorStop(1, '#090d16');
            ctx.fillStyle = grad;
            
            const r = 110;
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(512 - r, 0);
            ctx.quadraticCurveTo(512, 0, 512, r);
            ctx.lineTo(512, 512 - r);
            ctx.quadraticCurveTo(512, 512, 512 - r, 512);
            ctx.lineTo(r, 512);
            ctx.quadraticCurveTo(0, 512, 0, 512 - r);
            ctx.lineTo(0, r);
            ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();
            ctx.fill();

            // Accent Glow Border
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 14;
            ctx.stroke();

            ctx.fillStyle = '#f8fafc';
            ctx.shadowColor = 'rgba(56, 189, 248, 0.5)';
            ctx.shadowBlur = 24;
            ctx.shadowOffsetY = 8;

            ctx.beginPath();
            ctx.moveTo(256, 95);
            ctx.lineTo(90, 225);
            ctx.lineTo(130, 225);
            ctx.lineTo(130, 425);
            ctx.lineTo(382, 425);
            ctx.lineTo(382, 225);
            ctx.lineTo(422, 225);
            ctx.closePath();
            ctx.fill();

            ctx.shadowColor = 'transparent';
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(160, 260, 55, 60);
            ctx.fillRect(297, 260, 55, 60);
            ctx.fillRect(160, 345, 55, 80);
            ctx.fillRect(297, 345, 55, 80);

            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(235, 335, 42, 90);

            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.moveTo(275, 155);
            ctx.lineTo(235, 230);
            ctx.lineTo(265, 230);
            ctx.lineTo(237, 295);
            ctx.lineTo(287, 220);
            ctx.lineTo(257, 220);
            ctx.closePath();
            ctx.fill();

            const iconDataUrl = canvas.toDataURL('image/png');
            document.getElementById('appleTouchIcon').href = iconDataUrl;
            document.getElementById('androidIcon').href = iconDataUrl;

            const manifestObj = {
                name: "Universal Rent Manager",
                short_name: "RentManager",
                start_url: window.location.href,
                display: "standalone",
                background_color: "#090d16",
                theme_color: "#090d16",
                icons: [
                    {
                        src: iconDataUrl,
                        sizes: "512x512",
                        type: "image/png",
                        purpose: "any maskable"
                    }
                ]
            };

            const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
            const manifestLink = document.createElement('link');
            manifestLink.rel = 'manifest';
            manifestLink.href = URL.createObjectURL(manifestBlob);
            document.head.appendChild(manifestLink);
        })();

    <script>
        const DB_KEY = 'universal_rent_manager_store';
        
        let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
            properties: [
                {
                    id: 'prop_demo',
                    name: 'Sunshine Residency',
                    unitRate: 8.5,
                    commonBaseReading: 1200,
                    rooms: [
                        { id: 'room_101', name: '101', tenant: 'Rahul Sharma', rent: 8000, defaultDues: 0, lastReading: 450 },
                        { id: 'room_102', name: '102', tenant: 'Priya Verma', rent: 9000, defaultDues: 0, lastReading: 780 }
                    ],
                    history: {}
                }
            ]
        };

        function saveDB() {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        let currentView = 'home';
        let selectedPropId = null;
        let selectedMonthKey = null;

        function getMonthKey(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            return `${y}-${m}`;
        }

        function formatMonthKey(monthKey) {
            const [y, m] = monthKey.split('-').map(Number);
            return new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
        }

        function generateRecentMonthsList() {
            const list = [];
            const d = new Date();
            for (let i = 0; i < 6; i++) {
                const target = new Date(d.getFullYear(), d.getMonth() - i, 1);
                list.push(getMonthKey(target));
            }
            return list;
        }

        function navigateTo(view, payload = {}) {
            currentView = view;
            ['view-home', 'view-property-months', 'view-month-billing', 'view-admin'].forEach(v => {
                document.getElementById(v).classList.add('hidden');
            });

            const backBtn = document.getElementById('backBtn');
            const adminBtn = document.getElementById('adminBtn');
            const headerSubText = document.getElementById('headerSubText');

            if (view === 'home') {
                document.getElementById('view-home').classList.remove('hidden');
                backBtn.classList.add('hidden');
                adminBtn.classList.remove('hidden');
                headerSubText.innerText = 'Locations';
                selectedPropId = null;
                selectedMonthKey = null;
                renderHomeProperties();
            } else if (view === 'property-months') {
                document.getElementById('view-property-months').classList.remove('hidden');
                backBtn.classList.remove('hidden');
                adminBtn.classList.add('hidden');
                selectedPropId = payload.propId;
                const prop = db.properties.find(p => p.id === selectedPropId);
                headerSubText.innerText = prop ? prop.name : 'Property Months';
                renderPropertyMonths();
            } else if (view === 'month-billing') {
                document.getElementById('view-month-billing').classList.remove('hidden');
                backBtn.classList.remove('hidden');
                adminBtn.classList.add('hidden');
                selectedMonthKey = payload.monthKey;
                headerSubText.innerText = formatMonthKey(selectedMonthKey);
                renderMonthBillingView();
            } else if (view === 'admin') {
                document.getElementById('view-admin').classList.remove('hidden');
                backBtn.classList.remove('hidden');
                adminBtn.classList.add('hidden');
                headerSubText.innerText = 'Directory Settings';
                renderAdminProperties();

        function saveMonthlyCalculations() {
            const prop = db.properties.find(p => p.id === selectedPropId);
            if (!prop || prop.rooms.length === 0) return;

            const unitRate = prop.unitRate;
            const commonPrev = parseFloat(document.getElementById('inputCommonPrev').value) || 0;
            const commonCurr = parseFloat(document.getElementById('inputCommonCurr').value) || 0;
            const commonExpense = parseFloat(document.getElementById('inputCommonExpense').value) || 0;
            const totalUnits = prop.rooms.length;

            const commonUnits = (commonCurr > commonPrev) ? (commonCurr - commonPrev) : 0;
            const commonElecCost = commonUnits * unitRate;
            const commonElecPerUnit = commonElecCost / totalUnits;
            const commonExpPerUnit = commonExpense / totalUnits;

            let grandTotal = 0;
            const computedRoomsData = [];

            prop.rooms.forEach(room => {
                const prev = parseFloat(document.getElementById(`prev_${room.id}`).value) || 0;
                const curr = parseFloat(document.getElementById(`curr_${room.id}`).value) || 0;
                const dues = parseFloat(document.getElementById(`dues_${room.id}`).value) || 0;
                const extra = parseFloat(document.getElementById(`extra_${room.id}`).value) || 0;

                const consumedUnits = (curr > prev) ? (curr - prev) : 0;
                const elecBill = consumedUnits * unitRate;
                const totalBill = Math.round(room.rent + elecBill + commonElecPerUnit + commonExpPerUnit + extra + dues);

                grandTotal += totalBill;

                computedRoomsData.push({
                    roomId: room.id,
                    name: room.name,
                    tenant: room.tenant,
                    rent: room.rent,
                    prevReading: prev,
                    currReading: curr,
                    consumedUnits: consumedUnits,
                    elecBill: elecBill,
                    commonElecShare: commonElecPerUnit,
                    commonExpShare: commonExpPerUnit,
                    dues: dues,
                    extra: extra,
                    totalBill: totalBill
                });
            });

            if (!prop.history) prop.history = {};
            prop.history[selectedMonthKey] = {
                monthKey: selectedMonthKey,
                savedAt: new Date().toISOString(),
                commonPrev: commonPrev,
                commonCurr: commonCurr,
                commonUnits: commonUnits,
                commonElecCost: commonElecCost,
                commonExpense: commonExpense,
                roomsData: computedRoomsData,
                summary: {
                    grandTotal: grandTotal,
                    totalRooms: totalUnits
                }
            };

            saveDB();
            renderMonthBillingView();
            alert(`Rent record for ${formatMonthKey(selectedMonthKey)} saved successfully!`);
        }

            if (!room) return;

            const name = prompt("Room Name/No:", room.name);
            if (!name) return;
            const tenant = prompt("Tenant Name:", room.tenant);
            const rent = parseFloat(prompt("Base Rent (₹):", room.rent));
            const lastReading = parseFloat(prompt("Base Meter Reading:", room.lastReading));
            const dues = parseFloat(prompt("Dues (₹):", room.defaultDues));

            room.name = name.trim();
            if (tenant) room.tenant = tenant.trim();
            if (!isNaN(rent)) room.rent = rent;
            if (!isNaN(lastReading)) room.lastReading = lastReading;
            if (!isNaN(dues)) room.defaultDues = dues;

            saveDB();
            renderAdminProperties();
        }

        function deleteRoom(propId, roomId) {
            const prop = db.properties.find(p => p.id === propId);
            if (!prop) return;
            if (!confirm("Remove this unit?")) return;

            prop.rooms = prop.rooms.filter(r => r.id !== roomId);
            saveDB();
            renderAdminProperties();
        }

        window.onload = () => {
            navigateTo('home');
        };
    </script>
</body>
</html>
